
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyChat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eaf2ed;color:#19352a}
header{background:#087e57;color:white;padding:22px;text-align:center;font-size:27px;font-weight:bold}
main{max-width:430px;margin:30px auto;padding:15px}
.card{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 15px #0001}
h2{text-align:center}
p{text-align:center;line-height:1.6}
input{width:100%;padding:14px;border:1px solid #bdcec4;border-radius:10px;font-size:16px;margin:10px 0}
button{width:100%;padding:14px;background:#087e57;color:white;border:0;border-radius:10px;font-size:16px;margin-top:10px}
.small{font-size:12px;color:#697c71}
.hidden{display:none!important}
</style>
</head>
<body>
<header>💬 MyChat</header>
<main>
<section class="card" id="phoneScreen">
<h2>ফোন নম্বর দিয়ে লগইন</h2>
<p>দেশের কোডসহ তোমার ফোন নম্বর লেখো।</p>
<input id="phone" type="tel" placeholder="+8801XXXXXXXXX">
<div id="recaptcha-container"></div>
<button onclick="requestOTP()">OTP যাচাইয়ের ধাপে যাও</button>
<p class="small">এই ডেমো এখনো SMS পাঠায় না।</p>
</section>

<section class="card hidden" id="otpScreen">
<h2>OTP যাচাই</h2>
<p id="sentTo"></p>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="৬ সংখ্যার OTP">
<button onclick="verifyOTP()">OTP যাচাই করো</button>
<button onclick="backToPhone()">ফোন নম্বর পরিবর্তন</button>
<p class="small">আসল OTP পেতে Firebase Phone Authentication যুক্ত করতে হবে।</p>
</section>

<section class="card hidden" id="homeScreen">
<h2>MyChat-এ স্বাগতম!</h2>
<p id="userPhone"></p>
<p>তোমার অ্যাকাউন্টের স্ক্রিন তৈরি হয়েছে।</p>
<p class="small">এটি ডেমো; বাস্তব লগইন সম্পন্ন হয়নি।</p>
<button onclick="logout()">লগআউট</button>
</section>
</main>

<script>
let phoneNumber='';
function requestOTP(){
 const phone=document.getElementById('phone').value.trim();
 if(!/^\+[1-9]\d{7,14}$/.test(phone)){
  alert('দেশের কোডসহ নম্বর লেখো। যেমন +8801XXXXXXXXX');
  return;
 }
 phoneNumber=phone;
 document.getElementById('sentTo').textContent=
 'নম্বর: '+phone+' — এটি শুধু ডেমো, SMS পাঠানো হয়নি।';
 document.getElementById('phoneScreen').classList.add('hidden');
 document.getElementById('otpScreen').classList.remove('hidden');
}
function verifyOTP(){
 alert('আসল OTP যাচাই এখনো যুক্ত হয়নি। Firebase যুক্ত করার পর এটি কাজ করবে।');
}
function backToPhone(){
 document.getElementById('otpScreen').classList.add('hidden');
 document.getElementById('phoneScreen').classList.remove('hidden');
}
function logout(){
 document.getElementById('homeScreen').classList.add('hidden');
 document.getElementById('phoneScreen').classList.remove('hidden');
 document.getElementById('otp').value='';
}
</script>
</body>
</html>
